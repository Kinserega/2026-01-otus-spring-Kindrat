services:

  postgres:
    image: postgres:16
    container_name: personal-budget-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: personal-budget-auth-service

    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  render-template-service:
    build:
      context: ./render-template-service
      dockerfile: Dockerfile
    container_name: personal-budget-template-service
    environment:
      SERVER_PORT: 8083
    ports:
      - "8083:8083"

  finance-service:
    build:
      context: ./finance-service
      dockerfile: Dockerfile
    container_name: personal-budget-finance-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      INTEGRATION_AUTH_SERVICE_URL: http://auth-service:8081
      INTEGRATION_TEMPLATE_SERVICE_URL: http://render-template-service:8083
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
    ports:
      - "8082:8082"
    depends_on:
      auth-service:
        condition: service_started
      render-template-service:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    external: true
    name: auth-service_postgres_data


