server:
  port: 8082

spring:
  application:
    name: finance-service

  datasource:
    url: jdbc:postgresql://localhost:15432/auth_db
    username: budget_user
    password: budget_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

integration:
  auth-service:
    url: ${INTEGRATION_AUTH_SERVICE_URL:http://localhost:8081}
  template-service:
    url: ${INTEGRATION_TEMPLATE_SERVICE_URL:http://localhost:8083}

telegram:
  bot:
    username: ${TELEGRAM_BOT_USERNAME}
    token: ${TELEGRAM_BOT_TOKEN}


springdoc:
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 2
    instances:
      authServiceBreaker:
        base-config: default
      templateServiceBreaker:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,logfile,circuitbreakers
  endpoint:
    health:
      show-details: always
    logfile:
      enabled: true

logging:
  file:
    name: ${LOG_FILE:logs/application.log}
