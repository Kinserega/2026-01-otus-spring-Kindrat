<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>List of all books</title>
    <style type="text/css">
        body {
            padding: 50px;
        }

        .books {
            border: 1px solid steelblue;
            width: 300px;
            border-collapse: collapse;
        }

        .books tr td, th {
            padding: 5px;
            border: 1px solid steelblue;
        }

        .books td:last-child, td:first-child {
            width: 50px;
        }

        .margin_bottom {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
<h3>Книги:</h3>
<a href="edit_book.html" th:href="@{/edit_book}">
    <button class="margin_bottom" type="button">Добавить книгу</button>
</a>
<table class="books">
    <thead>
    <tr>
        <th>ID</th>
        <th>Название</th>
        <th>Автор</th>
        <th>Жанр</th>
        <th>Комментарии</th>
        <th>Действие</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}" th:object="${book}">
        <td th:text="*{id}">1</td>
        <td th:text="*{title}">War and piece</td>
        <td th:text="*{author.fullName}">L. N. Tolstoy</td>

        <td>
        <span th:each="genre, iterStat : *{genres}">
            <span th:text="${genre.name}">Genre</span><span th:if="${!iterStat.last}">, </span>
        </span>
        </td>

        <td>
            <a th:href="@{/book_comments(id=*{id})}">Показать комменатарии</a>
        </td>

        <td>
            <a th:href="@{/edit_book(id=*{id})}">Редактировать</a>
            <form th:action="@{/delete(id=${book.id})}" method="post" style="display:inline">
                <button type="submit">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
