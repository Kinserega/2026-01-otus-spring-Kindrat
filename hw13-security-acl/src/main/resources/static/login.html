<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Авторизация</title>

    <style>
        body {
            padding: 50px;
            font-family: Arial, sans-serif;
        }

        .login-form {
            width: 300px;
            border: 1px solid steelblue;
            padding: 20px;
            border-radius: 5px;
        }

        .row {
            margin-top: 10px;
        }

        .error {
            color: red;
            margin-bottom: 10px;
        }

        .success {
            color: green;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 10px;
            padding: 6px 12px;
        }
    </style>
</head>
<body>

<h3>Авторизация</h3>

<div class="login-form">

    <div class="error" id="error-block" style="display:none;">
        Неверный логин или пароль
    </div>

    <div class="success" id="logout-block" style="display:none;">
        Вы успешно вышли из системы
    </div>

    <form action="/login" method="post">

        <div class="row">
            <label for="username">Логин:</label>
            <input id="username"
                   name="username"
                   type="text"
                   required>
        </div>

        <div class="row">
            <label for="password">Пароль:</label>
            <input id="password"
                   name="password"
                   type="password"
                   required>
        </div>

        <div class="row">
            <button type="submit">Войти</button>
        </div>

    </form>
</div>

<script>
    const params = new URLSearchParams(window.location.search);

    if (params.has('error')) {
        document.getElementById('error-block').style.display = 'block';
    }

    if (params.has('logout')) {
        document.getElementById('logout-block').style.display = 'block';
    }
</script>

</body>
</html>
