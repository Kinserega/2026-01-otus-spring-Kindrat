spring:
  shell:
    interactive:
      enabled: false

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  data:
    mongodb:
      database: test

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.5